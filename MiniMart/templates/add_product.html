{% extends "base.html" %}
{% block title %}Add Product - MiniMart{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <h1>Add Product</h1>
        <p>Add a new product to your inventory.</p>
    </div>
</div>

<div class="form-card">
    <form method="POST" enctype="multipart/form-data">
        <div class="form-group">
            <label>Product Image</label>
            <div class="image-preview-box" id="previewBox">No image selected</div>
            <input type="file" name="image" accept=".png,.jpg,.jpeg,.gif,.webp" onchange="previewImage(event, 'previewBox')">
        </div>

        <div class="form-grid">
            <div class="form-group">
                <label for="product_id">Product ID</label>
                <input type="text" id="product_id" name="product_id" value="{{ form.product_id or '' }}" required>
            </div>
            <div class="form-group">
                <label for="name">Product Name</label>
                <input type="text" id="name" name="name" value="{{ form.name or '' }}" required>
            </div>
            <div class="form-group">
                <label for="category">Category</label>
                <select id="category" name="category" required>
                    <option value="">Select category</option>
                    {% for cat in categories %}
                        <option value="{{ cat }}" {{ 'selected' if form.category == cat }}>{{ cat }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="price">Price (₱)</label>
                <input type="number" step="0.01" min="0" id="price" name="price" value="{{ form.price or '' }}" required>
            </div>
            <div class="form-group">
                <label for="stock">Stock</label>
                <input type="number" min="0" id="stock" name="stock" value="{{ form.stock or '' }}" required>
            </div>
            <div class="form-group">
                <label for="low_stock_threshold">Low Stock Threshold</label>
                <input type="number" min="0" id="low_stock_threshold" name="low_stock_threshold" value="{{ form.low_stock_threshold or 5 }}">
            </div>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Add Product</button>
            <a href="{{ url_for('products') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
    function previewImage(event, boxId) {
        const box = document.getElementById(boxId);
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = e => { box.innerHTML = '<img src="' + e.target.result + '">'; };
            reader.readAsDataURL(file);
        }
    }
</script>
{% endblock %}
